# Fails when entity models changed without a new EF migration.
name: db-model-check

on:
  push:
    branches: [master]
    paths: ['J&A_Jewelry/**']
  pull_request:
    paths: ['J&A_Jewelry/**']

jobs:
  pending-model-changes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: J&A_Jewelry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: dotnet tool install --global dotnet-ef --version 9.0.3
      - run: dotnet build --nologo
      - run: dotnet ef migrations has-pending-model-changes